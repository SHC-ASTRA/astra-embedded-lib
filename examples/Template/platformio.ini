; PlatformIO project template for an ASTRA MCU.
; Copy this to the root of a new firmware project and edit the marked lines.
;
; Docs: https://github.com/SHC-ASTRA/astra-embedded-lib

[env:template]              ; EDIT: convention is <submodule>_<board>_<prod|dev>
platform = espressif32
framework = arduino

; EDIT: the board this firmware is built for.
;   adafruit_feather_esp32_v2  - Adafruit ESP32 Feather V2 - smallest, oldest, most expensive
;   esp32doit-devkit-v1        - ESP32 DOIT Devkit V1 - most abundant, cheapest feeling
;   esp32-s3-devkitc-1         - ESP32-S3 DevkitC-1 - newest, largest, has a boot issue
board = adafruit_feather_esp32_v2

; Serial monitor. These two make the plain-text command interface usable by hand:
; send_on_enter sends the line when you hit ENTER (with the newline the MCU reads up to),
; and monitor_echo turns on local echo so you can see what you're typing.
monitor_speed = 115200      ; Must match SERIAL_BAUD from AstraMisc.h
monitor_filters = send_on_enter
monitor_echo = true

build_flags =
	; EDIT: exactly one of CORE, ARM, DIGIT, LANCE, CITADEL.
	; This is the MCU's address on the VicCAN bus. Omit it and the board builds, runs, and
	; ignores every message addressed specifically to it.
	-D CORE

lib_deps =
	; Pin a release tag, not a branch, so this build keeps working after breaking changes.
	https://github.com/SHC-ASTRA/astra-embedded-lib#v2.0.0

	; Needed for CAN.
	handmade0octopus/ESP32-TWAI-CAN@^1.0.1

	; EDIT: should only be needed by Core.
	adafruit/Adafruit BMP3XX Library@^2.1.2
	adafruit/Adafruit BNO055@^1.6.3
	adafruit/Adafruit Unified Sensor@^1.1.14
	sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.25
